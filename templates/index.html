<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Result Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="page page-entry">
    <div class="card form-card">
        <div class="card-header">
            <span class="eyebrow">Academic Portal</span>
            <h1>Enter Student Marks</h1>
        </div>

        <form action="/submit" method="POST" class="result-form">
            <div class="field-group">
                <label for="name">Student Name</label>
                <input id="name" type="text" name="name" placeholder="e.g. Aisha Khan" required>
            </div>

            <div class="field-group">
                <label for="roll_no">Roll Number</label>
                <input id="roll_no" type="text" name="roll_no" placeholder="e.g. 2024-101" required>
            </div>

            <div class="marks-grid">
                <div class="field-group">
                    <label for="marks1">Subject 1</label>
                    <input id="marks1" type="number" name="marks1" min="0" max="100" placeholder="0-100" required>
                </div>

                <div class="field-group">
                    <label for="marks2">Subject 2</label>
                    <input id="marks2" type="number" name="marks2" min="0" max="100" placeholder="0-100" required>
                </div>

                <div class="field-group">
                    <label for="marks3">Subject 3</label>
                    <input id="marks3" type="number" name="marks3" min="0" max="100" placeholder="0-100" required>
                </div>
            </div>

            <button type="submit">Submit Result</button>
        </form>
    </div>
</body>
</html>
