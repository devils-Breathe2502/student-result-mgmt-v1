<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Student Result Entry</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="container">
        <h1>Enter Student Marks</h1>
        <form action="/submit" method="POST">
            <label>Student Name</label>
            <input type="text" name="name" required>

            <label>Roll Number</label>
            <input type="text" name="roll_no" required>

            <label>Subject 1 Marks (0-100)</label>
            <input type="number" name="marks1" min="0" max="100" required>

            <label>Subject 2 Marks (0-100)</label>
            <input type="number" name="marks2" min="0" max="100" required>

            <label>Subject 3 Marks (0-100)</label>
            <input type="number" name="marks3" min="0" max="100" required>

            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
